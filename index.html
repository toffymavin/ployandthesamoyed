<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd23f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Samoyed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Ploy's Samoyed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: tender and playful, a small handmade gift for one person
   IDEA: a sunflower-yellow pocket pet toy whose screen is a snowy Christmas market at night
   PICTURE: the market scene with a fluffy round Samoyed in the middle, yellow string lights above
   COLOUR and TYPE: yellow case, evergreen night screen, berry-red accent; Fredoka + Nunito
   LAYOUT: one device column: name and XP, screen, four stats, four round buttons, three tabs */
:root{color-scheme:light dark;--bg:light-dark(#fff3cf,#17150f);--ink:#3a2a12;--case:#ffd23f;--case-d:#e9b400;--cream:#fff8e1;--berry:#d8344a;--soft:#8a6a2c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,ui-rounded,system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:var(--ink)}
.case{width:100%;max-width:440px;background:linear-gradient(160deg,#ffe36e,var(--case) 45%,#f8c41c);border-radius:40px;padding:16px 16px 20px;box-shadow:inset 0 -6px 0 var(--case-d),inset 0 3px 0 #fff4ad,0 20px 40px -18px rgba(90,60,0,.6)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 6px 12px}
.for{font:600 13px/1 Fredoka,sans-serif;color:#7a5a12}
.name{display:block;font:700 30px/1.05 Fredoka,sans-serif;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name:focus-visible,.btn:focus-visible,.tab:focus-visible,.food:focus-visible,.item:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.lv{font:600 14px/1 Fredoka,sans-serif;color:#7a5a12}
.xp{width:132px;flex:none}
.bar{height:12px;border-radius:8px;background:var(--cream);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .5s}
.xp .bar i{background:var(--berry)}
.bar.low i{background:var(--berry)}
.xpt{font:600 12px/1 Fredoka,sans-serif;text-align:right;margin-top:5px;color:#7a5a12;white-space:nowrap}
.screen{position:relative;aspect-ratio:6/5;border-radius:26px;overflow:hidden;border:6px solid var(--ink);background:#0c241c;box-shadow:0 0 0 4px var(--case-d)}
.screen>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx>*{position:absolute;transform:translate(-50%,-50%)}
.say{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);width:max-content;max-width:86%;background:var(--cream);border:2.5px solid var(--ink);border-radius:16px;padding:7px 12px;font:700 14px/1.3 Nunito,sans-serif;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.say.on{opacity:1;transform:translate(-50%,0)}
.say:after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--cream);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.chip{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:5px;background:rgba(12,36,28,.72);color:#fff8e1;border-radius:14px;padding:3px 10px 3px 6px;font:600 13px/1.4 Fredoka,sans-serif;pointer-events:none}
.chip svg{width:18px;height:18px}
.snd{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.snd button{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 2px 0 var(--ink)}
.snd button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.snd svg{width:20px;height:20px}
.snd .x{display:none}.snd .off{opacity:.55}.snd .off .x{display:block}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:18px 6px 2px}
.st{display:grid;grid-template-columns:24px minmax(0,1fr);gap:3px 8px;align-items:center}
.st svg{width:24px;height:24px;grid-row:span 2}
.st b{font:600 13px/1 Fredoka,sans-serif}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font:600 14px/1 Fredoka,sans-serif;cursor:pointer}
.act span{width:62px;height:62px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.act:active span{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.act:focus-visible span{outline:3px solid var(--berry);outline-offset:3px}
.act svg{width:34px;height:34px}
.tabs{display:flex;gap:8px;margin-top:18px}
.tab{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:23px;background:var(--case-d);border:0;font:600 15px/1 Fredoka,sans-serif;box-shadow:inset 0 2px 0 rgba(0,0,0,.12);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab .dot{position:absolute;top:5px;right:10px;width:11px;height:11px;border-radius:50%;background:var(--berry);border:2px solid var(--case-d);display:none}
.tab.has .dot{display:block}
.ov{position:fixed;inset:0;background:rgba(24,16,4,.55);display:none;align-items:flex-end;justify-content:center;z-index:9;padding:12px}
.ov.on{display:flex}.ov.mid{align-items:center}
.pane{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:28px;padding:20px 18px 18px;animation:up .25s ease-out}
.pane h2{font:700 26px/1.1 Fredoka,sans-serif;margin:0 0 4px;text-wrap:balance}
.pane p{margin:8px 0}
.sub{color:var(--soft);font-size:14px;margin:2px 0 14px!important}
.btn{min-height:46px;padding:0 20px;border-radius:23px;border:3px solid var(--ink);background:var(--case);font:600 16px/1 Fredoka,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.nm{width:100%;font:600 20px Fredoka,sans-serif;padding:10px 14px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);margin-top:6px}
.list{display:grid;gap:10px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 12px 12px 14px;border-radius:18px;background:#fff;border:2px solid #efdfae}
.q b{font:600 15px/1.25 Fredoka,sans-serif;display:block;margin-bottom:6px}
.q .bar{height:10px}
.q small{display:block;color:var(--soft);font-size:13px;margin-top:4px}
.ok{font:600 14px Fredoka,sans-serif;color:#2f7a4f;padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.food,.item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:18px;background:#fff;border:2px solid #efdfae;font:600 15px/1.2 Fredoka,sans-serif;cursor:pointer;text-align:center;position:relative}
.food svg{width:56px;height:56px}
.food small,.item small{font:700 12px/1.3 Nunito,sans-serif;color:var(--soft)}
.tag{position:absolute;top:8px;right:8px;background:var(--case);border:2px solid var(--ink);border-radius:10px;font:600 11px/1 Fredoka,sans-serif;padding:3px 6px}
.item{min-height:76px;justify-content:center}
.item.on{background:var(--case);border-color:var(--ink)}
.item[disabled]{opacity:.5;cursor:default}
.env{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:#fff;border:2px solid #efdfae}
.env svg{width:44px;height:44px}
.env b{font:600 16px/1.2 Fredoka,sans-serif;display:block}
.env small{color:var(--soft);font-size:13px}
.paper{background:#fffdf6 repeating-linear-gradient(transparent 0 29px,#f1e4bf 29px 30px);border-radius:16px;border:2px solid #efdfae;padding:18px 20px 22px;font:700 17px/30px Nunito,sans-serif}
.paper p{margin:0 0 30px}.paper p:last-child{margin:0}
.paper .sig{text-align:right;font-family:Fredoka,sans-serif;font-weight:600}
.big{display:block;margin:0 auto 6px;width:84px;height:84px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--ink);color:var(--cream);font:600 15px/1.3 Fredoka,sans-serif;padding:10px 16px;border-radius:18px;z-index:20;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
#dogW{cursor:pointer}
#dogB{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:100% 60%;animation:wag 1.3s ease-in-out infinite}
.leg{will-change:transform}
#dogA.walk .la{animation:step .5s ease-in-out infinite}
#dogA.walk .lb{animation:step .5s ease-in-out -.25s infinite}
#dogA.walk #dogB{animation:wb .25s ease-in-out infinite}
#dogA{transform-box:fill-box;transform-origin:50% 100%}
#dogA.joy #dogB{animation:wig .32s ease-in-out infinite}
#dogA.jump{animation:jump .9s ease-out}
#dogA.chomp{animation:chomp .5s ease-in-out 2}
#dogA.zzz #dogB{animation-duration:4.5s}
.zz text{transform-box:fill-box;animation:zz 2.6s ease-out infinite;opacity:0}
.flake{animation:fall linear infinite}
.bulb{animation:tw 2.4s ease-in-out infinite}
.tuft{cursor:pointer}
.heart{animation:rise 1.2s ease-out forwards}
.bub{animation:rise 1.6s ease-out forwards}
.pop{animation:popin 1.3s ease-out forwards}
.ball{animation:ball 1s ease-out forwards}
.acts{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.act span{width:56px!important;height:56px!important}.act svg{width:30px!important;height:30px!important}
.tabs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))}
#scene{touch-action:none}
.chip.trip{left:auto;right:10px;bottom:10px;display:none}.chip.trip.on{display:flex}
.brushc{position:absolute;left:0;top:0;width:34px;height:34px;transform:translate(-30%,-80%) rotate(-25deg);pointer-events:none;display:none}.brushc.on{display:block}
.opt{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;background:#fff;border:2px solid #efdfae;cursor:pointer}
.opt svg{width:44px;height:44px}.opt b{display:block;font:600 17px/1.2 Fredoka,sans-serif}.opt small{color:var(--soft);font-size:13px;line-height:1.3;display:block}
.dots{display:flex;gap:6px;margin:2px 0 4px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}.dots i.on{background:var(--case)}
.stamps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stamp{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:6px;background:#fff;border:3px dashed var(--c);color:var(--c);text-align:center}
.stamp b{font:700 28px/1 Fredoka,sans-serif}.stamp span{font:600 15px Fredoka,sans-serif;color:var(--ink)}.stamp small{font-size:12px;color:var(--soft)}
.stamp.off{border-color:#e3d5ad;color:#c9b88a}.stamp.big{width:150px;margin:0 auto 10px;transform:rotate(-4deg)}
.cg{display:block;width:100%;aspect-ratio:8/9;border-radius:18px;border:3px solid var(--ink);touch-action:none;background:#0c241c}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ph{padding:0;border:2px solid #efdfae;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}.ph img{display:block;width:100%}
.big-ph{display:block;width:100%;border-radius:12px;border:2px solid #efdfae;-webkit-touch-callout:default}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards;pointer-events:none}
.drop{animation:drop .7s ease-in forwards}
#friend{cursor:pointer}#friend.walk .fa{animation:fstep .4s ease-in-out infinite}#friend.walk .fb{animation:fstep .4s ease-in-out -.2s infinite}
.notebob{animation:nb 1.6s ease-in-out infinite;transform-box:fill-box;cursor:pointer}#note{cursor:pointer}
.plane{animation:flyby 5s linear forwards}
.bulb{opacity:var(--bulb,1)}
#dogA.sit{animation:sit 1.8s ease-in-out}#dogA.paw #dogB{animation:tilt 1.8s ease-in-out}#dogA.paw .leg3{animation:pawup 1.8s ease-in-out}#dogA.huh #dogB{animation:tilt 1s ease-in-out}
@keyframes sit{20%,80%{transform:scaleY(.86) scaleX(1.06)}}
@keyframes tilt{20%,80%{transform:rotate(-5deg)}}
@keyframes pawup{20%,80%{transform:translateY(-48px)}}
@keyframes fstep{50%{transform:translateY(-4px)}}
@keyframes nb{50%{transform:translateY(-4px)}}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@keyframes drop{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,120%);opacity:.6}}
@keyframes flyby{from{transform:translate(-40px,70px)}to{transform:translate(400px,20px)}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes bob{50%{transform:scaleY(1.02)}}
@keyframes wag{50%{transform:rotate(-14deg)}}
@keyframes step{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}}
@keyframes wig{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
@keyframes wb{50%{transform:translateY(-7px)}}
@keyframes jump{30%{transform:translateY(-110px)}55%{transform:translateY(0) scaleY(.9)}72%{transform:translateY(-30px)}}
@keyframes chomp{50%{transform:scaleY(.94) scaleX(1.03)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-28px)}}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(var(--d),330px)}}
@keyframes tw{50%{opacity:.4}}
@keyframes rise{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx,0px)),-280%) scale(1.15);opacity:0}}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-30%) scale(.5);opacity:0}}
@keyframes ball{0%{transform:translate(-50%,-50%) translate(-130px,30px) scale(.8)}45%{transform:translate(-50%,-50%) translate(-60px,-80px)}85%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(-50%,-50%);opacity:0}}
@media (prefers-reduced-motion:reduce){.flake,.bulb,#dogB,.tail,.zz text,.leg{animation:none!important}.zz text{opacity:1}}
@media (max-width:380px){.act span{width:56px;height:56px}.name{font-size:26px}.xp{width:112px}.tab{font-size:14px}.tab svg{display:none}.act span{width:50px!important;height:50px!important}.act{font-size:13px}}
</style>
</head>
<body>
<main class="case">
  <div class="top">
    <div>
      <div class="for">For polyploii 👩🏻🐻‍❄️</div>
      <button class="name" id="nm" data-a="rename" title="Rename">Samoyed</button>
      <div class="lv" id="lv">Puppy · Lv 1</div>
    </div>
    <div class="xp"><div class="snd"><button id="sndM" data-a="snd" data-k="music" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="17" r="2.8" fill="currentColor"/><circle cx="16.5" cy="15" r="2.8" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><button id="sndS" data-a="snd" data-k="sfx" aria-label="Sound effects"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div><div class="bar" id="xpb"><i></i></div><div class="xpt" id="xpt">0 / 30 XP</div></div>
  </div>

  <div class="screen">
    <svg id="scene" viewBox="0 0 360 300" aria-label="A Samoyed at a snowy Christmas market">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sk1" offset="0" stop-color="#0b2219"/><stop id="sk2" offset="1" stop-color="#1f4d3c"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffd23f" stop-opacity=".5"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
        <linearGradient id="snowg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f7"/><stop offset="1" stop-color="#cfdae4"/></linearGradient>
      <clipPath id="cBody" clipPathUnits="userSpaceOnUse"><rect width="548" height="468"/></clipPath><clipPath id="cL0" clipPathUnits="userSpaceOnUse"><rect x="138" y="464" width="78" height="80"/></clipPath><clipPath id="cL1" clipPathUnits="userSpaceOnUse"><rect x="216" y="464" width="74" height="80"/></clipPath><clipPath id="cL2" clipPathUnits="userSpaceOnUse"><rect x="290" y="464" width="66" height="80"/></clipPath><clipPath id="cL3" clipPathUnits="userSpaceOnUse"><rect x="356" y="464" width="72" height="80"/></clipPath></defs>
      <rect width="360" height="300" fill="url(#sky)"/>
      <g id="back"></g><g id="skyfx"></g><g id="deco"></g>
      <ellipse id="shadow" cx="180" cy="268" rx="60" ry="8" fill="#0b2a20" opacity=".22"/>
      <g id="fur"></g><g id="note"></g><g id="friend"></g><g id="sign"></g>
      <g id="dogW"><g id="dogA"><g id="dogB"></g></g></g>
      <g id="snow"></g>
      <rect id="night" width="360" height="300" fill="#03110b" opacity="0" pointer-events="none" style="transition:opacity .8s"/>
    </svg>
    <div class="fx" id="fx"></div>
    <div class="say" id="say" role="status" aria-live="polite"></div>
    <div class="chip" id="chip"></div><div class="chip trip" id="tripc"></div><div class="brushc" id="brushc"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="acts">
    <button class="act" data-a="feed"><span id="i-feed"></span>Feed</button>
    <button class="act" data-a="play"><span id="i-play"></span>Play</button>
    <button class="act" data-a="bath"><span id="i-bath"></span>Bath</button>
    <button class="act" data-a="sleep"><span id="i-sleep"></span><em id="sleepL" style="font-style:normal">Sleep</em></button>
    <button class="act" data-a="fly"><span id="i-fly"></span><em id="flyL" style="font-style:normal">Fly</em></button>
  </div>

  <div class="tabs">
    <button class="tab" data-a="quests" id="t-q"><span id="i-q"></span>Quests<i class="dot"></i></button>
    <button class="tab" data-a="closet" id="t-c"><span id="i-c"></span>Closet<i class="dot"></i></button>
    <button class="tab" data-a="shop" id="t-s"><span id="i-s"></span>Shop<i class="dot"></i></button>
    <button class="tab" data-a="letters" id="t-l"><span id="i-l"></span>Letters<i class="dot"></i></button>
    <button class="tab" data-a="stamps" id="t-st"><span id="i-st"></span>Stamps<i class="dot"></i></button>
    <button class="tab" data-a="album" id="t-a"><span id="i-a"></span>Album<i class="dot"></i></button>
  </div>
</main>

<div class="ov" id="ov"><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const KEY='ploy-samoyed-v1',$=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const f=n=>Math.round(n*10)/10;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const need=l=>20+l*10,MAXL=10;

const CH=[['C3','E4','G4'],['G3','D4','B4'],['A3','E4','C5'],['G3','D4','B4'],['F3','C4','A4'],['D3','F4','A4'],['C3','E4','G4'],['G3','D4','B4'],['C3','E4','G4'],['G3','D4','B4'],['A3','E4','C5'],['G3','D4','B4'],['F3','C4','A4'],['G3','D4','B4'],['C3','E4','G4'],['C3','G3','E4']];
let mNext=0,mStep=0,mOn=false;
function musicTick(){if(!mOn||!AC||AC.state!=='running')return;const beat=60/96;if(mNext<AC.currentTime)mNext=AC.currentTime+.1;
 while(mNext<AC.currentTime+.4){const bar=Math.floor(mStep/3)%16,b=mStep%3,n=MEL[bar][b],c=CH[bar];
  if(n!=='-'){tone(NT[n],mNext,1.3,{v:.06,dest:musG});tone(NT[n]*2,mNext,.35,{v:.012,dest:musG})}
  if(b===0)tone(NT[c[0]],mNext,1.6,{type:'triangle',v:.05,dest:musG});else{tone(NT[c[1]],mNext,.7,{v:.022,dest:musG});tone(NT[c[2]],mNext,.7,{v:.022,dest:musG})}
  noise(mNext,.05,{v:b===0?.02:.012,fq:7000,q:.8,type:'highpass',dest:musG});
  mNext+=beat;mStep++}}
setInterval(musicTick,120);
function musicLevel(){if(!AC)return;const t=AC.currentTime,v=S.music?(S.sleep?.45:1):0;musG.gain.cancelScheduledValues(t);musG.gain.setTargetAtTime(v,t,.4);mOn=S.music}
let silentEl=null;
function silentWav(){const n=8000,b=new ArrayBuffer(44+n*2),d=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,16000,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlock(){const c=ac();if(!c)return;
 try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}
 if(!audioOn){audioOn=true;
  try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}
  try{silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=.01;const p=silentEl.play();if(p)p.catch(()=>{})}catch(e){}}
 if(c.state!=='running')c.resume().then(musicLevel).catch(()=>{});else if(!mSet){mSet=true;musicLevel()}}

 catch(e){toast("Couldn't take the photo here")}}
function albumPane(){open(`<h2>Photo album</h2><p class="sub">Postcards of ${T('{n}')}. Up to 12 photos.</p><div class="row" style="justify-content:flex-start;margin:0 0 12px"><button class="btn" data-a="snap">Take a photo</button></div>${ALB.length?`<div class="album">${ALB.map((p,i)=>`<button class="ph" data-a="photo" data-i="${i}"><img src="${p.u}" alt="Postcard ${i+1}"></button>`).join('')}</div>`:'<p class="sub">No photos yet. Dress up your pup and take the first one!</p>'}<div class="row"><button class="btn ghost" data-a="close">Close</button></div>`,'album')}
function photoPane(i){const p=ALB[i];if(!p)return;open(`<img class="big-ph" src="${p.u}" alt="Postcard"><p class="sub" style="margin-top:10px!important">Press and hold the photo to save it to your phone.</p><div class="row"><button class="btn ghost" data-a="delphoto" data-i="${i}">Delete</button>${self!==top?'':`<a class="btn" href="${p.u}" download="samoyed-postcard.jpg" style="display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)">Download</a>`}<button class="btn" data-a="album">Back</button></div>`,'photo')}

/* --- shop --- */
function shopPane(){const b=furBal(),sec=(t,list)=>`<p style="font:600 15px Fredoka,sans-serif;margin:14px 0 8px">${t}</p><div class="grid2">${list}</div>`;
 const items=ITEMS.filter(i=>i.shop).map(i=>{const own=S.owned.includes(i.id);return`<button class="item${own?' on':''}" data-a="${own?'closet':'buy'}" data-id="${i.id}" ${!own&&b<i.shop?'disabled':''}>${i.name}<small>${own?'Owned · in the closet':i.shop+' fur'}</small></button>`}).join('');
 const decos=DECOS.map(d=>{const own=S.owned.includes(d.id),on=S.deco.includes(d.id);return`<button class="item${on?' on':''}" data-a="${own?'place':'buy'}" data-id="${d.id}" ${!own&&b<d.price?'disabled':''}>${d.name}<small>${own?(on?'In the market · tap to put away':'Tap to place'):d.price+' fur'}</small></button>`}).join('');
 open(`<h2>Fur shop</h2><p class="sub">Trade the fur tufts you collect. You have <b>${b}</b> fur. Brush or play with ${T('{n}')} to get more.</p>${sec('Outfits',items)}${sec('Decorations',decos)}<div class="row"><button class="btn ghost" data-a="close">Close</button></div>`,'shop')}
function buy(id){const it=ITEMS.find(i=>i.id===id&&i.shop),d=DECOS.find(x=>x.id===id),price=it?it.shop:d?d.price:0;if(!price||S.owned.includes(id)||furBal()<price)return;
 S.spent+=price;S.owned.push(id);if(d){S.deco.push(id);drawDeco()}sfx('coin');toast(`Bought: ${(it||d).name}`);if(it){S.eq[it.slot]=it.id;drawDog(true)}say(pick(['Ooh, new things!','Thank you, Ploy!','Is that for me?!']));render();shopPane()}

/* render */
const STATS=[['hunger','Full','bowl'],['happy','Happy','heart'],['clean','Clean','drop'],['energy','Energy','bolt']];
function render(){const s=S.st,st=stageOf(S.lv);
 $('#nm').textContent=S.name||'Samoyed';$('#lv').textContent=`${STAGE[st]} · Lv ${S.lv}`;
 const mx=S.lv>=MAXL;$('#xpb i').style.width=(mx?100:S.xp/need(S.lv)*100)+'%';$('#xpt').textContent=mx?'Max level':`${S.xp} / ${need(S.lv)} XP`;
 $('#stats').innerHTML=STATS.map(([k,l,ic])=>`<div class="st">${ico(ic)}<b>${l}</b><div class="bar${s[k]<30?' low':''}" role="meter" aria-label="${l}" aria-valuenow="${Math.round(s[k])}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s[k]}%"></i></div></div>`).join('');
 $('#i-sleep').innerHTML=ico(S.sleep?'sun':'moon');$('#sleepL').textContent=S.sleep?'Wake':'Sleep';
 $('#night').setAttribute('opacity',S.sleep?.5:0);
 $('#chip').innerHTML=`${sz('tuft',18)}${furBal()}`;$('#tripc').innerHTML=S.trip?`${sz('plane',18)}Ploy is in ${cityName(S.trip.c)}`:'';$('#tripc').classList.toggle('on',!!S.trip);$('#flyL').textContent=S.trip?'Home':'Fly';drawSound();
 resetQuests();$('#t-q').classList.toggle('has',QUESTS.some(q=>(S.q.p[q.id]||0)>=q.g&&!S.q.done.includes(q.id)));
 $('#t-l').classList.toggle('has',LETTERS.some((l,i)=>S.lv>=l.lv&&!S.read.includes(i)));
 drawDog()}

/* events */
$('#i-feed').innerHTML=ico('bowl');$('#i-play').innerHTML=ico('ball');$('#i-bath').innerHTML=ico('bubbles');
$('#i-q').innerHTML=ico('quest');$('#i-c').innerHTML=ico('hanger');$('#i-l').innerHTML=ico('env');$('#i-s').innerHTML=ico('bag');$('#i-st').innerHTML=ico('stampI');$('#i-a').innerHTML=ico('camera');$('#i-fly').innerHTML=ico('plane');$('#brushc').innerHTML=sz('brush',34);
const ACT={feed:()=>S.sleep?blockedAsleep():foodPane(),eat:d=>eat(d.id),play:playPane,fetch:()=>{close();play()},catch:catchPane,cgstop:()=>{if(CG){CG.t=99}},tricks:trickPane,trick:d=>doTrick(d.id),bath,sleep,
 fly:flyPane,depart:d=>depart(d.id),land,stamps:stampPane,shop:shopPane,buy:d=>buy(d.id),place:d=>{const i=S.deco.indexOf(d.id);if(i>=0)S.deco.splice(i,1);else S.deco.push(d.id);drawDeco();shopPane()},album:albumPane,snap,photo:d=>photoPane(+d.i),delphoto:d=>{ALB.splice(+d.i,1);saveAlb();albumPane()},note:d=>readNote(+d.i),quests:questPane,closet:closetPane,letters:()=>{locked=false;lettersPane()},
 close:()=>{locked=false;close()},snd:d=>{S[d.k]=!S[d.k];if(d.k==='music'){unlock();musicLevel()}else if(S.sfx)sfx('tap');drawSound();save()},rename:()=>namePane(false),read:d=>readLetter(+d.i),
 claim:d=>{const q=QUESTS.find(x=>x.id===d.id);if(!q||S.q.done.includes(q.id)||(S.q.p[q.id]||0)<q.g)return;S.q.done.push(q.id);sfx('coin');toast(`+${q.xp} XP`);const lv=S.lv;gain(q.xp);if(S.lv===lv)questPane();save()},
 wear:d=>{const i=ITEMS.find(x=>x.id===d.id);if(!i||!unlocked(i))return;locked=false;S.eq[i.slot]=S.eq[i.slot]===i.id?null:i.id;drawDog(true);closetPane();sfx('yip');save();if(S.eq[i.slot])say(pick(['How do I look, Ploy?','Fashion!','Matching with the market lights!']))},
 reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}location.hash='';location.reload()}};
document.addEventListener('click',e=>{if(noClick&&e.target.closest('#scene'))return;const t=e.target.closest('[data-a]');if(t&&!t.disabled){ACT[t.dataset.a]&&ACT[t.dataset.a](t.dataset);if(t.dataset.a!=='reset')save();return}
 const tu=e.target.closest('.tuft');if(tu){grabFur(+tu.dataset.t);save();return}
 if(e.target.closest('#note')){readNote();return}
 if(e.target.closest('#friend')&&fr){hearts(2);sfx('yip');fxAt(sz('heart',20),fr.x/3.6,62,'heart',1200,0);return}
 if(e.target.closest('#dogW')){pat();save();return}
 if(e.target===$('#ov'))close()});
document.addEventListener('submit',e=>{e.preventDefault();const v=($('#nmI').value||'').trim().slice(0,14);if(!v)return;const was=!S.name;S.name=v.replace(/[<>&"]/g,'');locked=false;close();render();save();drawNote();
 if(was){joy(2000);hearts(4);setTimeout(()=>say(`Hi Ploy! I'm {n}. Can I stay with you?`,5000),400)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(Date.now()-S.last>6*3600e3)setTimeout(()=>say(pick(LINES.wel)),500)});
function hash(){const h=location.hash;if(h==='#reset')open(`<h2>Start over?</h2><p>This erases ${T('{n}')} and all progress on this device.</p><div class="row"><button class="btn ghost" data-a="close">Keep my pup</button><button class="btn" data-a="reset">Start over</button></div>`,'reset',true);
 if(h==='#boost'){gain(100);toast('Preview boost: +100 XP')}}
window.addEventListener('hashchange',hash);
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);

/* start */
buildScene();applyTime();setInterval(applyTime,60000);drawDeco();brushInit();
let lastT=Date.now(),gap=0;
if(!first){gap=Date.now()-S.last;decay(Math.min(gap,72*3600e3)/3600e3)}
resetQuests();render();drawDog(true);drawNote();setInterval(drawNote,60000);
if(first||!S.name)namePane(true);else setTimeout(()=>say(S.trip?`Ploy! Are you still in ${cityName(S.trip.c)}? I miss you.`:gap>6*3600e3?pick(LINES.wel):(timeLine()||pick(LINES.gen))),600);
hash();requestAnimationFrame(frame);
if(!canStore)setTimeout(()=>toast("This app can't save progress. Open the link in Safari or Chrome."),first?6000:1500);
setInterval(()=>{const n=Date.now(),h=(n-lastT)/3600e3;lastT=n;const was=S.sleep;decay(Math.min(h,72));if(was&&!S.sleep){drawDog(true);musicLevel();sfx('wake');say('*big stretch* I slept so well, Ploy!')}render()},1000);
setInterval(save,5000);
setInterval(()=>{if(paneKind||!S.name||S.sleep||Date.now()-lastSay<16000)return;const m=mood();say(LINES[m]&&Math.random()<.75?pick(LINES[m]):Math.random()<.25?(timeLine()||pick(LINES.gen)):pick(LINES.gen))},9000);
setInterval(()=>{if(!S.sleep&&!paneKind&&Math.random()<.35)spawnFur(1)},20000);
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
