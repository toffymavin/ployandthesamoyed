<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffd23f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Samoyed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Ploy's Samoyed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="case">
  <div class="top">
    <div>
      <div class="for">For polyploii 👩🏻🐻‍❄️</div>
      <button class="name" id="nm" data-a="rename" title="Rename">Samoyed</button>
      <div class="lv" id="lv">Puppy · Lv 1</div>
    </div>
    <div class="xp"><div class="snd"><button id="sndM" data-a="snd" data-k="music" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="17" r="2.8" fill="currentColor"/><circle cx="16.5" cy="15" r="2.8" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><button id="sndS" data-a="snd" data-k="sfx" aria-label="Sound effects"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="x" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><button id="bkB" data-a="backup" aria-label="Backup"><svg viewBox="0 0 24 24"><path d="M12 3.5v10.5M7.5 9.5 12 14l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div><div class="bar" id="xpb"><i></i></div><div class="xpt" id="xpt">0 / 30 XP</div></div>
  </div>

  <div class="screen">
    <svg id="scene" viewBox="0 0 360 300" aria-label="A Samoyed at a snowy Christmas market">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sk1" offset="0" stop-color="#0b2219"/><stop id="sk2" offset="1" stop-color="#1f4d3c"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffd23f" stop-opacity=".5"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
        <linearGradient id="snowg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f7"/><stop offset="1" stop-color="#cfdae4"/></linearGradient>
      <filter id="dirtF" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .52  0 0 0 0 .42  0 0 0 0 .3  0 0 0 1 0"/></filter><clipPath id="cBody" clipPathUnits="userSpaceOnUse"><rect width="548" height="468"/></clipPath><clipPath id="cL0" clipPathUnits="userSpaceOnUse"><rect x="138" y="464" width="78" height="80"/></clipPath><clipPath id="cL1" clipPathUnits="userSpaceOnUse"><rect x="216" y="464" width="74" height="80"/></clipPath><clipPath id="cL2" clipPathUnits="userSpaceOnUse"><rect x="290" y="464" width="66" height="80"/></clipPath><clipPath id="cL3" clipPathUnits="userSpaceOnUse"><rect x="356" y="464" width="72" height="80"/></clipPath></defs>
      <rect width="360" height="300" fill="url(#sky)"/>
      <g id="back"></g><g id="skyfx"></g><g id="deco"></g>
      <ellipse id="shadow" cx="180" cy="268" rx="60" ry="8" fill="#0b2a20" opacity=".22"/><ellipse id="bshadow" cx="120" cy="268" rx="0" ry="5" fill="#0b2a20" opacity=".22"/>
      <g id="stampwall"></g><g id="wspot"></g><g id="bottle"></g><g id="fur"></g><g id="toys"></g><g id="sunny"></g><g id="gift"></g><g id="note"></g><g id="cookie"></g><g id="friend"></g><g id="sign"></g><g id="fball"></g>
      <g id="dogW"><g id="dogA"><g id="dogB"></g></g></g><g id="baby"></g><g id="topmsg"></g>
      <g id="snow"></g>
      <rect id="night" width="360" height="300" fill="#03110b" opacity="0" pointer-events="none" style="transition:opacity .8s"/>
    </svg>
    <div class="fx" id="fx"></div>
    <div class="say" id="say" role="status" aria-live="polite"></div>
    <div class="chip" id="chip"></div><div class="chip trip" id="tripc"></div><div class="chip place" id="placec"></div><div class="fade" id="fade"></div><div class="banner" id="banner"></div><div class="brushc" id="brushc"></div><button class="wact" id="wact" data-a="wact"></button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="acts">
    <button class="act" data-a="feed"><span id="i-feed"></span>Feed</button>
    <button class="act" data-a="play"><span id="i-play"></span>Play</button>
    <button class="act" data-a="bath"><span id="i-bath"></span>Bath</button>
    <button class="act" data-a="sleep"><span id="i-sleep"></span><em id="sleepL" style="font-style:normal">Sleep</em></button>
    <button class="act" data-a="walk"><span id="i-walk"></span><em id="walkL" style="font-style:normal">Walkie!</em></button>
    <button class="act" data-a="fly"><span id="i-fly"></span><em id="flyL" style="font-style:normal">Fly</em></button>
  </div>

  <div class="tabs">
    <button class="tab" data-a="quests" id="t-q"><span id="i-q"></span>Quests<i class="dot"></i></button>
    <button class="tab" data-a="closet" id="t-c"><span id="i-c"></span>Closet<i class="dot"></i></button>
    <button class="tab" data-a="shop" id="t-s"><span id="i-s"></span>Shop<i class="dot"></i></button>
    <button class="tab" data-a="letters" id="t-l"><span id="i-l"></span>Letters<i class="dot"></i></button>
    <button class="tab" data-a="stamps" id="t-st"><span id="i-st"></span>Stamps<i class="dot"></i></button>
    <button class="tab" data-a="album" id="t-a"><span id="i-a"></span>Album<i class="dot"></i></button>
  </div>
</main>

<div class="ov" id="ov"><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<!-- game code: loaded in this order (later files can use anything from earlier ones) -->
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/content.js"></script>
<script src="js/state.js"></script>
<script src="js/dog.js"></script>
<script src="js/scene.js"></script>
<script src="js/sound.js"></script>
<script src="js/ui.js"></script>
<script src="js/actions.js"></script>
<script src="js/world-data.js"></script>
<script src="js/room.js"></script>
<script src="js/flight.js"></script>
<script src="js/tricks.js"></script>
<script src="js/games/treat-catch.js"></script>
<script src="js/album-shop.js"></script>
<script src="js/city-art.js"></script>
<script src="js/extras.js"></script>
<script src="js/places.js"></script>
<script src="js/home.js"></script>
<script src="js/render.js"></script>
<script src="js/messages.js"></script>
<script src="js/walk-extras.js"></script>
<script src="js/games/arcade.js"></script>
<script src="js/games/fluffy-pop.js"></script>
<script src="js/games/snack-cart.js"></script>
<script src="js/games/fluffy-jump.js"></script>
<script src="js/games/pack-suitcase.js"></script>
<script src="js/duck-backup.js"></script>
<script src="js/events.js"></script>
<script src="js/start.js"></script>
<script src="js/notify.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
