<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ploy's Samoyed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender and playful, a small handmade gift for one person
   IDEA: a sunflower-yellow pocket pet toy whose screen is a snowy Christmas market at night
   PICTURE: the market scene with a fluffy round Samoyed in the middle, yellow string lights above
   COLOUR and TYPE: yellow case, evergreen night screen, berry-red accent; Fredoka + Nunito
   LAYOUT: one device column: name and XP, screen, four stats, four round buttons, three tabs */
:root{color-scheme:light dark;--bg:light-dark(#fff3cf,#17150f);--ink:#3a2a12;--case:#ffd23f;--case-d:#e9b400;--cream:#fff8e1;--berry:#d8344a;--soft:#8a6a2c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,ui-rounded,system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:14px 12px 28px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:var(--ink)}
.case{width:100%;max-width:440px;background:linear-gradient(160deg,#ffe36e,var(--case) 45%,#f8c41c);border-radius:40px;padding:16px 16px 20px;box-shadow:inset 0 -6px 0 var(--case-d),inset 0 3px 0 #fff4ad,0 20px 40px -18px rgba(90,60,0,.6)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 6px 12px}
.for{font:600 19px/1.1 Fredoka,sans-serif;color:#7a5a12;margin-bottom:2px}
.name{display:block;font:700 30px/1.05 Fredoka,sans-serif;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name:focus-visible,.btn:focus-visible,.tab:focus-visible,.food:focus-visible,.item:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.lv{font:600 14px/1 Fredoka,sans-serif;color:#7a5a12}
.xp{width:132px;flex:none}
.bar{height:12px;border-radius:8px;background:var(--cream);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .5s}
.xp .bar i{background:var(--berry)}
.bar.low i{background:var(--berry)}
.xpt{font:600 12px/1 Fredoka,sans-serif;text-align:right;margin-top:5px;color:#7a5a12;white-space:nowrap}
.screen{position:relative;aspect-ratio:6/5;border-radius:26px;overflow:hidden;border:6px solid var(--ink);background:#0c241c;box-shadow:0 0 0 4px var(--case-d)}
.screen>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx>*{position:absolute;transform:translate(-50%,-50%)}
.say{position:absolute;left:50%;top:40%;width:max-content;max-width:60%;background:var(--cream);border:2.5px solid var(--ink);border-radius:16px;padding:7px 11px;font:700 13.5px/1.3 Nunito,sans-serif;text-align:left;opacity:0;transform:translate(var(--tx,0),var(--ty,-50%)) scale(.85);transition:opacity .2s,transform .2s;pointer-events:none;z-index:2}
.say.on{opacity:1;transform:translate(var(--tx,0),var(--ty,-50%)) scale(1)}
.say:after{content:'';position:absolute;width:11px;height:11px;background:var(--cream)}
.say.r:after{left:-7.5px;top:50%;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.say.l:after{right:-7.5px;top:50%;border-right:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.say.t{text-align:center}.say.t:after{left:50%;bottom:-7.5px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.chip{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:5px;background:rgba(12,36,28,.72);color:#fff8e1;border-radius:14px;padding:3px 10px 3px 6px;font:600 13px/1.4 Fredoka,sans-serif;pointer-events:none}
.chip svg{width:18px;height:18px}
.snd{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.snd button{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 2px 0 var(--ink)}
.snd button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.snd svg{width:20px;height:20px}
.snd .x{display:none}.snd .off{opacity:.55}.snd .off .x{display:block}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:18px 6px 2px}
.st{display:grid;grid-template-columns:24px minmax(0,1fr);gap:3px 8px;align-items:center}
.st svg{width:24px;height:24px;grid-row:span 2}
.st b{font:600 13px/1 Fredoka,sans-serif}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font:600 14px/1 Fredoka,sans-serif;cursor:pointer}
.act span{width:62px;height:62px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.act:active span{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.act:focus-visible span{outline:3px solid var(--berry);outline-offset:3px}
.act svg{width:34px;height:34px}
.tabs{display:flex;gap:8px;margin-top:18px}
.tab{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:23px;background:var(--case-d);border:0;font:600 15px/1 Fredoka,sans-serif;box-shadow:inset 0 2px 0 rgba(0,0,0,.12);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab .dot{position:absolute;top:5px;right:10px;width:11px;height:11px;border-radius:50%;background:var(--berry);border:2px solid var(--case-d);display:none}
.tab.has .dot{display:block}
.ov{position:fixed;inset:0;background:rgba(24,16,4,.55);display:none;align-items:flex-end;justify-content:center;z-index:9;padding:12px}
.ov.on{display:flex}.ov.mid{align-items:center}
.pane{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:28px;padding:20px 18px 18px;animation:up .25s ease-out}
.pane h2{font:700 26px/1.1 Fredoka,sans-serif;margin:0 0 4px;text-wrap:balance}
.pane p{margin:8px 0}
.sub{color:var(--soft);font-size:14px;margin:2px 0 14px!important}
.btn{min-height:46px;padding:0 20px;border-radius:23px;border:3px solid var(--ink);background:var(--case);font:600 16px/1 Fredoka,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.nm{width:100%;font:600 20px Fredoka,sans-serif;padding:10px 14px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);margin-top:6px}
.list{display:grid;gap:10px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 12px 12px 14px;border-radius:18px;background:#fff;border:2px solid #efdfae}
.q b{font:600 15px/1.25 Fredoka,sans-serif;display:block;margin-bottom:6px}
.q .bar{height:10px}
.q small{display:block;color:var(--soft);font-size:13px;margin-top:4px}
.ok{font:600 14px Fredoka,sans-serif;color:#2f7a4f;padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.food,.item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:18px;background:#fff;border:2px solid #efdfae;font:600 15px/1.2 Fredoka,sans-serif;cursor:pointer;text-align:center;position:relative}
.food svg{width:56px;height:56px}
.food small,.item small{font:700 12px/1.3 Nunito,sans-serif;color:var(--soft)}
.tag{position:absolute;top:8px;right:8px;background:var(--case);border:2px solid var(--ink);border-radius:10px;font:600 11px/1 Fredoka,sans-serif;padding:3px 6px}
.item{min-height:76px;justify-content:center}.thumb{width:72px;height:60px;margin-bottom:4px;overflow:visible}.thumb .bulb{animation:none}
.item.on{background:var(--case);border-color:var(--ink)}
.item[disabled]{opacity:.5;cursor:default}
.env{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:#fff;border:2px solid #efdfae}
.env svg{width:44px;height:44px}
.env b{font:600 16px/1.2 Fredoka,sans-serif;display:block}
.env small{color:var(--soft);font-size:13px}
.paper{background:#fffdf6 repeating-linear-gradient(transparent 0 29px,#f1e4bf 29px 30px);border-radius:16px;border:2px solid #efdfae;padding:18px 20px 22px;font:700 17px/30px Nunito,sans-serif}
.paper p{margin:0 0 30px}.paper p:last-child{margin:0}
.paper .sig{text-align:right;font-family:Fredoka,sans-serif;font-weight:600}
.big{display:block;margin:0 auto 6px;width:84px;height:84px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--ink);color:var(--cream);font:600 15px/1.3 Fredoka,sans-serif;padding:10px 16px;border-radius:18px;z-index:20;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
#dogW{cursor:pointer}
#dogB{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:100% 60%;animation:wag 1.3s ease-in-out infinite}
.leg{will-change:transform}
#dogA.walk .la{animation:step .5s ease-in-out infinite}
#dogA.walk .lb{animation:step .5s ease-in-out -.25s infinite}
#dogA.walk #dogB{animation:wb .25s ease-in-out infinite}
#dogA{transform-box:fill-box;transform-origin:50% 100%}
#dogA.joy #dogB{animation:wig .32s ease-in-out infinite}
#dogA.jump{animation:jump .9s ease-out}
#dogA.chomp{animation:chomp .5s ease-in-out 2}
#dogA.zzz #dogB{animation-duration:4.5s}
.zz text{transform-box:fill-box;animation:zz 2.6s ease-out infinite;opacity:0}
.flake{animation:fall linear infinite}
.bulb{animation:tw 2.4s ease-in-out infinite}
.tuft{cursor:pointer}
.heart{animation:rise 1.2s ease-out forwards}
.bub{animation:rise 1.6s ease-out forwards}
.pop{animation:popin 1.3s ease-out forwards}
.ball{animation:ball 1s ease-out forwards}
.acts{grid-template-columns:repeat(3,minmax(0,1fr))!important;row-gap:14px!important}
.act span{width:56px!important;height:56px!important}.act svg{width:30px!important;height:30px!important}
.tabs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))}
#scene{touch-action:none}
.chip.trip{left:auto;right:10px;bottom:10px;display:none}.chip.trip.on{display:flex}
.brushc{position:absolute;left:0;top:0;width:34px;height:34px;transform:translate(-30%,-80%) rotate(-25deg);pointer-events:none;display:none}.brushc.on{display:block}
.opt{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;background:#fff;border:2px solid #efdfae;cursor:pointer}
.opt svg{width:44px;height:44px}.opt b{display:block;font:600 17px/1.2 Fredoka,sans-serif}.opt small{color:var(--soft);font-size:13px;line-height:1.3;display:block}
.dots{display:flex;gap:6px;margin:2px 0 4px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}.dots i.on{background:var(--case)}
.stamps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stamp{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:6px;background:#fff;border:3px dashed var(--c);color:var(--c);text-align:center}
.stamp b{font:700 28px/1 Fredoka,sans-serif}.stamp span{font:600 15px Fredoka,sans-serif;color:var(--ink)}.stamp small{font-size:12px;color:var(--soft)}
.stamp.off{border-color:#e3d5ad;color:#c9b88a}.stamp.big{width:150px;margin:0 auto 10px;transform:rotate(-4deg)}
.cg{display:block;width:100%;aspect-ratio:8/9;border-radius:18px;border:3px solid var(--ink);touch-action:none;background:#0c241c}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ph{padding:0;border:2px solid #efdfae;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}.ph img{display:block;width:100%}
.big-ph{display:block;width:100%;border-radius:12px;border:2px solid #efdfae;-webkit-touch-callout:default}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards;pointer-events:none}
.drop{animation:drop .7s ease-in forwards}
#friend{cursor:pointer}#friend.walk .fa{animation:fstep .4s ease-in-out infinite}#friend.walk .fb{animation:fstep .4s ease-in-out -.2s infinite}
.notebob{animation:nb 1.6s ease-in-out infinite;transform-box:fill-box;cursor:pointer}#note{cursor:pointer}
.plane{animation:flyby 5.4s ease-in forwards}
.bulb{opacity:var(--bulb,1)}
#dogA.sit{animation:sit 1.8s ease-in-out}#dogA.paw #dogB{animation:tilt 1.8s ease-in-out}#dogA.paw .leg3{animation:pawup 1.8s ease-in-out}#dogA.huh #dogB{animation:tilt 1s ease-in-out}
@keyframes sit{20%,80%{transform:scaleY(.86) scaleX(1.06)}}
@keyframes tilt{20%,80%{transform:rotate(-5deg)}}
@keyframes pawup{20%,80%{transform:translateY(-48px)}}
@keyframes fstep{50%{transform:translateY(-4px)}}
@keyframes nb{50%{transform:translateY(-4px)}}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@keyframes drop{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,120%);opacity:.6}}
@keyframes flyby{0%{transform:translate(-60px,96px) rotate(-6deg)}100%{transform:translate(420px,26px) rotate(-10deg)}}
.stamps{gap:14px!important}.stampc{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.stampc small{font-size:12px;color:var(--soft)}
.stp{display:block;width:100%;max-width:150px;filter:drop-shadow(0 2px 2px rgba(58,42,18,.18))}.stampc:nth-child(odd) .stp{transform:rotate(-2deg)}.stampc:nth-child(even) .stp{transform:rotate(2deg)}
.stp.big{width:130px;margin:0 auto 6px;transform:rotate(-4deg)}
.fc{position:relative;display:flex;flex-direction:column;align-items:center}.fcck{width:180px}.fl1{animation:crk1 .7s ease-out forwards;transform-box:fill-box;transform-origin:100% 100%}.fl2{animation:crk2 .7s ease-out forwards;transform-box:fill-box;transform-origin:0 100%}
.slip{margin-top:-18px;background:#fff;border:2px solid #efdfae;border-radius:6px;padding:12px 16px;max-width:300px;text-align:center;box-shadow:0 3px 0 #efdfae;animation:slip .6s .35s ease-out both}.slip p{margin:0 0 6px!important;font:700 17px/1.4 Nunito,sans-serif}.slip small{color:#d8344a;font:600 13px Fredoka,sans-serif}
.gicons{display:flex;justify-content:center;gap:10px;margin:4px 0 10px}.gicons svg{width:52px;height:52px}
.gdots{display:flex;justify-content:center;gap:8px;margin:14px 0 2px}.gdots i{width:9px;height:9px;border-radius:50%;background:#e6d6a6}.gdots i.on{background:var(--ink);width:22px;border-radius:5px}
#baby{cursor:pointer}#babyA.walk .la{animation:step .4s ease-in-out infinite}#babyA.walk .lb{animation:step .4s ease-in-out -.2s infinite}#babyA.walk #babyB{animation:wb .2s ease-in-out infinite}#babyA.zzz #babyB{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.5s ease-in-out infinite}
#cookie{cursor:pointer}
@keyframes crk1{to{transform:rotate(-14deg) translateX(-6px)}}@keyframes crk2{to{transform:rotate(14deg) translateX(6px)}}@keyframes slip{from{opacity:0;transform:translateY(-14px) scale(.8)}}
.acts .act span{width:58px!important;height:58px!important}
#scene:not([data-scene=room]) #note,#scene:not([data-scene=room]) #cookie,#scene:not([data-scene=room]) #gift,#scene:not([data-scene=room]) #sunny,#scene:not([data-scene=room]) #toys,#scene:not([data-scene=room]) #deco,#scene:not([data-scene=room]) #stampwall{display:none}
#gift,#sunny,.toy{cursor:pointer}#dogA.shake #dogB{animation:shk .16s linear infinite}@keyframes shk{25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}.tbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tbox .item svg{width:44px;height:44px}
.chip.place{left:50%;right:auto;bottom:auto;top:10px;transform:translateX(-50%);display:none;background:rgba(255,248,225,.92);color:var(--ink);border:2px solid var(--ink)}.chip.place.on{display:flex}
.fade{position:absolute;inset:0;background:#1d1a17;opacity:0;pointer-events:none;transition:opacity .4s}.fade.on{opacity:1}
.banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-30px) rotate(-3deg);background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 22px 10px;font:700 34px/1 Caveat,cursive;color:var(--ink);text-align:center;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap;z-index:3}.banner small{display:block;font:600 22px/1.2 Caveat,cursive;color:#a8742a;margin-top:4px}.banner.on{opacity:1;transform:translate(-50%,0) rotate(-3deg)}
#dogA.run .la,#dogA.run .lb{animation-duration:.24s!important}
.hand{font:600 24px/1.25 Caveat,cursive;color:#2a3a6b;background:#fffdf6;border:2px dashed #efdfae;border-radius:12px;padding:12px 16px;margin:10px 0}.hand.c,.hand.c span{text-align:center}.hand span{display:block;text-align:right;color:#d8344a;font-weight:700}.hand.big{font-size:34px;text-align:center;border:0;background:none;color:var(--ink)}
.paper.hw{font:600 23px/32px Caveat,cursive;color:#2a3a6b;background:#fffdf6 repeating-linear-gradient(transparent 0 31px,#f1e4bf 31px 32px)}.paper.hw p{margin:0 0 16px}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:start;background:#fffdf6;border:2px solid #efdfae;border-radius:14px;padding:14px;box-shadow:0 3px 0 #efdfae;margin:8px 0}.pcard b{font:700 22px Fredoka,sans-serif}.pcard .hand{border:0;padding:6px 0;background:none;margin:4px 0 0}.pcr .stp{max-width:110px}
button.stampc{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.giftbox{display:flex;justify-content:center}.gb{width:150px;height:150px;overflow:visible}.gb .lid{animation:lid .7s ease-out forwards;transform-box:fill-box;transform-origin:0 100%}.gb .toyup{animation:toyup .8s .35s ease-out both;transform-box:fill-box}
.credits{text-align:center;padding:10px 0}.madeby{font:700 40px/1.15 Caveat,cursive;color:var(--ink);margin:22px 0 4px!important;transform:rotate(-2deg)}.credits .cs{margin:10px 0 0!important;color:var(--soft);font:600 14px Fredoka,sans-serif}.credits .cn{margin:2px 0 0!important;font:700 26px Fredoka,sans-serif}
@keyframes lid{to{transform:translate(-8px,-22px) rotate(-28deg)}}@keyframes toyup{from{transform:translateY(20px) scale(.4);opacity:0}to{transform:translateY(-14px) scale(1.1)}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes bob{50%{transform:scaleY(1.02)}}
@keyframes wag{50%{transform:rotate(-14deg)}}
@keyframes step{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}}
@keyframes wig{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
@keyframes wb{50%{transform:translateY(-7px)}}
@keyframes jump{30%{transform:translateY(-110px)}55%{transform:translateY(0) scaleY(.9)}72%{transform:translateY(-30px)}}
@keyframes chomp{50%{transform:scaleY(.94) scaleX(1.03)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-28px)}}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(var(--d),330px)}}
@keyframes tw{50%{opacity:.4}}
@keyframes rise{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx,0px)),-280%) scale(1.15);opacity:0}}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-30%) scale(.5);opacity:0}}
@keyframes ball{0%{transform:translate(-50%,-50%) translate(-130px,30px) scale(.8)}45%{transform:translate(-50%,-50%) translate(-60px,-80px)}85%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(-50%,-50%);opacity:0}}

let mNext=0,mStep=0,mOn=false;
function musicTick(){if(!mOn||!AC||AC.state!=='running')return;const beat=60/96;if(mNext<AC.currentTime)mNext=AC.currentTime+.1;
 while(mNext<AC.currentTime+.4){const bar=Math.floor(mStep/3)%16,b=mStep%3,n=MEL[bar][b],c=CH[bar];
  if(n!=='-'){tone(NT[n],mNext,1.3,{v:.06,dest:musG});tone(NT[n]*2,mNext,.35,{v:.012,dest:musG})}
  if(b===0)tone(NT[c[0]],mNext,1.6,{type:'triangle',v:.05,dest:musG});else{tone(NT[c[1]],mNext,.7,{v:.022,dest:musG});tone(NT[c[2]],mNext,.7,{v:.022,dest:musG})}
  noise(mNext,.05,{v:b===0?.02:.012,fq:7000,q:.8,type:'highpass',dest:musG});
  mNext+=beat;mStep++}}
setInterval(musicTick,120);
function musicLevel(){if(!AC)return;const t=AC.currentTime,v=S.music?(S.sleep?.45:1):0;musG.gain.cancelScheduledValues(t);musG.gain.setTargetAtTime(v,t,.4);mOn=S.music}
let silentEl=null;
function silentWav(){const n=8000,b=new ArrayBuffer(44+n*2),d=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,16000,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlock(){const c=ac();if(!c)return;
 try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}
 if(!audioOn){audioOn=true;
  try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}
  try{silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=.01;const p=silentEl.play();if(p)p.catch(()=>{})}catch(e){}}
 if(c.state!=='running')c.resume().then(musicLevel).catch(()=>{});else if(!mSet){mSet=true;musicLevel()}}

function resetQuests(){if(S.q.day!==today())S.q={day:today(),p:{},done:[]}}
function prog(id,n=1){resetQuests();const q=QUESTS.find(x=>x.id===id);if(!q)return;const before=S.q.p[id]||0;S.q.p[id]=Math.min(q.g,before+n);if(before<q.g&&S.q.p[id]>=q.g&&!S.q.done.includes(id))toast('Quest ready to claim: '+T(q.t))}

 sfx('level');setTimeout(()=>sfx('yip'),700);stopWalk(2500);drawDog(true);if(grew){anim('jump',900);setTimeout(()=>say(stageOf(to)===2?'Look at me, Ploy! All grown up!':'I got bigger! Did you notice?'),300)}

   fxAt(sz('heart',20),fr.x/3.6,(266-60)/3,'heart',1200,0)}else fr.x+=Math.sign(fr.tx-fr.x)*sp}

function doTrick(id){const t=TRICKS.find(x=>x.id===id);if(!t||blockedAsleep())return;close();stopWalk(4000);const was=learned(t),r=S.tr[id]||(S.tr[id]={n:0,last:''});let ok=was;
 if(!was&&r.last!==today()){r.n++;r.last=today();gain(5);if(r.n>=t.days){ok=true;setTimeout(()=>{toast(`${T('{n}')} learned ${t.name}!`);sfx('level')},1900);gain(20)}}

let br=null,noClick=false;
function scenePt(e){const sv=$('#scene'),p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(sv.getScreenCTM().inverse())}
function brushStroke(e){if(S.sleep)return;S.strokes=(S.strokes||0)+1;const wasM=S.mess||0;S.mess=clamp(wasM-5);if(wasM>=25&&S.mess<25)setTimeout(()=>{say(pick(['So smooth and fluffy now! Thank you, Ploy!','No more tangles! I feel like a cloud.']));hearts(3)},200);drawDog();S.fluff=clamp((S.fluff||0)+2);S.st.happy=clamp(S.st.happy+1);S.st.clean=clamp(S.st.clean+.5);sfx('brush');place();
 const p=scenePt(e);if(S.strokes%4===0){fxAt(sz('tuft',22),p.x/3.6,p.y/3,'drop',700);setTimeout(()=>spawnFurAt(p.x),650)}
 if(S.strokes%10===0){if(S.bx.day!==today())S.bx={day:today(),n:0};if(S.bx.n<10){S.bx.n++;gain(1)}}
 if(S.strokes%12===0&&(S.mess||0)>=25)say(pick(['Ouch… tangles… keep going!','Almost untangled!','My fur is getting better!']));else if(S.strokes%12===0)say(pick(['Ahh, right there.','Fluffier… fluffier…','Look at all that fluff!','Am I a cloud now?']));render()}

function brushInit(){const sv=$('#scene');

 window.addEventListener('pointermove',e=>{if(!br)return;const dx=e.clientX-br.x,dy=e.clientY-br.y,d=Math.hypot(dx,dy);br.x=e.clientX;br.y=e.clientY;br.d+=d;
  if(!br.m&&br.d>14){if(S.sleep){br=null;return blockedAsleep()}br.m=true;stopWalk(5000);$('#brushc').classList.add('on')}
  if(br.m){stopWalk(3000);br.acc+=d;const r=$('.screen').getBoundingClientRect(),c=$('#brushc');c.style.left=(e.clientX-r.left)+'px';c.style.top=(e.clientY-r.top)+'px';if(br.acc>40){br.acc=0;brushStroke(e)}}});

/* --- treat catch mini-game --- */
let CG=null,CGI=null;
const imgOf=k=>{const i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96">${G[k]}</svg>`);return i};
function cgImgs(){if(!CGI){CGI={kibble:imgOf('bowl'),somtam:imgOf('somtam'),steak:imgOf('steak'),burger:imgOf('burger'),chili:imgOf('chili'),heart:imgOf('heart'),dog:new Image()};CGI.dog.src='dog.png'}return CGI}
function catchPane(){if(blockedAsleep())return;if(S.st.energy<15){close();return say('Too sleepy to play… nap first?')}
 open(`<h2>Treat catch</h2><p class="sub">Drag to move ${T('{n}')}. Catch the food, dodge the chilies!</p><canvas id="cg" class="cg" width="640" height="720"></canvas><div class="row"><button class="btn ghost" data-a="cgstop">Stop</button></div>`,'game',true,true);startCG()}
function startCG(){const cv=$('#cg'),c=cv.getContext('2d'),I=cgImgs();
 CG={run:true,x:320,tx:320,dir:1,items:[],score:0,caught:0,favs:0,lives:3,t:0,spawn:.6,last:performance.now(),hit:0,c,cv,I};
 const mv=e=>{const r=cv.getBoundingClientRect();CG&&(CG.tx=(e.clientX-r.left)/r.width*640)};cv.addEventListener('pointerdown',mv);cv.addEventListener('pointermove',mv);
 requestAnimationFrame(cgLoop)}
const KINDS=[['kibble',1,.28],['somtam',3,.19],['steak',3,.19],['burger',3,.19],['chili',0,.15]];
function cgLoop(now){const g=CG;if(!g||!g.run)return;const dt=Math.min(.05,(now-g.last)/1000);g.last=now;g.t+=dt;
 const dx=g.tx-g.x;if(Math.abs(dx)>3){g.dir=dx>0?1:-1;g.x+=Math.sign(dx)*Math.min(Math.abs(dx),560*dt)}g.x=Math.max(70,Math.min(570,g.x));
 g.spawn-=dt;if(g.spawn<=0){let r=Math.random(),acc=0,k=KINDS[0];for(const q of KINDS){acc+=q[2];if(r<acc){k=q;break}}g.items.push({k:k[0],p:k[1],x:40+Math.random()*560,y:-50,vy:190+g.t*7+Math.random()*80,rot:rnd(-.4,.4)});g.spawn=Math.max(.32,.85-g.t*.013)}
 for(const it of g.items){it.y+=it.vy*dt;if(!it.done&&it.y>560&&it.y<650&&Math.abs(it.x-g.x)<78){it.done=true;if(it.k==='chili'){g.lives--;g.hit=.6;sfx('no')}else{g.score+=it.p;g.caught++;if(it.p===3)g.favs++;sfx('fur')}}}
 g.items=g.items.filter(it=>!it.done&&it.y<780);if(g.hit>0)g.hit-=dt;cgDraw();
 if(g.t>=40||g.lives<=0)return endCG();requestAnimationFrame(cgLoop)}
function cgDraw(){const{c,I}=CG,g=CG,day=tod==='day';
 const sky=c.createLinearGradient(0,0,0,720);sky.addColorStop(0,day?'#7cc6ef':'#0b2219');sky.addColorStop(1,day?'#d8f0fb':'#1f4d3c');c.fillStyle=sky;c.fillRect(0,0,640,720);
 c.fillStyle='#eef3f7';c.fillRect(0,650,640,70);c.fillStyle='#fff';c.fillRect(0,648,640,5);
 for(const it of g.items){c.save();c.translate(it.x,it.y);c.rotate(it.rot);c.drawImage(I[it.k],-38,-38,76,76);c.restore()}
 c.save();c.translate(g.x,686);c.scale(g.dir*.36,.36);if(I.dog.complete)c.drawImage(I.dog,-274,-512);c.restore();
 if(g.hit>0){c.fillStyle=`rgba(216,52,74,${g.hit*.35})`;c.fillRect(0,0,640,720)}
 c.fillStyle='rgba(255,248,225,.92)';c.beginPath();c.roundRect?c.roundRect(14,14,612,58,29):c.rect(14,14,612,58);c.fill();
 c.fillStyle=INK;c.font='600 30px Fredoka, sans-serif';c.textBaseline='middle';c.fillText(`Score ${g.score}`,36,44);c.textAlign='center';c.fillText(`${Math.max(0,Math.ceil(40-g.t))}s`,320,44);c.textAlign='left';
 for(let i=0;i<3;i++){c.globalAlpha=i<g.lives?1:.25;c.drawImage(I.heart,500+i*40,26,36,36)}c.globalAlpha=1}
function endCG(){const g=CG;if(!g)return;g.run=false;if(S.cg.day!==today())S.cg={day:today(),n:0};const xp=S.cg.n<3?Math.min(30,g.score):0;S.cg.n++;
 S.snacks+=g.favs;S.st.energy=clamp(S.st.energy-6,5);S.st.happy=clamp(S.st.happy+15);S.st.hunger=clamp(S.st.hunger-4,5);prog('play');CG=null;
 open(`${ico('star','big')}<h2 style="text-align:center">${g.lives<=0?'Too spicy!':'Time!'} Score ${g.score}</h2><p style="text-align:center">${T('{n}')} caught ${g.caught} treat${g.caught===1?'':'s'}${g.favs?` and saved <b>${g.favs} market treat${g.favs===1?'':'s'}</b> for later`:''}.${xp?` +${xp} XP`:' (XP is for the first 3 games each day.)'}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-a="close">Done</button>${S.st.energy>=15?'<button class="btn" data-a="catch">Play again</button>':''}</div>`,'cgend',true);
 if(xp)gain(xp);render();save();setTimeout(()=>say(g.score>=40?'That was the best game ever!':'Again! Again!'),400)}

function drawTM(){const on=S.name&&tmNew().length>0;$('#topmsg').innerHTML=on?`<g transform="translate(244 92) rotate(-8)"><g class="notebob"><circle r="22" fill="transparent"/><path d="M-17 3L17-11L3 13L-1 5Z" fill="#fff8e1" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M-1 5L17-11" stroke="${INK}" stroke-width="1.6"/><path d="M-1 5L-4 11L3 13" fill="#efe2bf" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 11s-3.2-1.7-3.2-3.8a1.7 1.7 0 0 1 3.2-.8 1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 3.8-3.2 3.8z" fill="#d8344a"/></g></g>`:''}
function readTM(id){const m=TM.find(x=>x.id===id);if(!m)return;const first=!S.tm.read.includes(id);if(first){S.tm.read.push(id);gain(3)}drawTM();sfx('letter');save();locked=false;
 const body=T(String(m.text)).split(/\n+/).map(x=>`<p>${esc(x)}</p>`).join('');
 open(`<div class="paper">${m.title?`<p><b>${esc(T(String(m.title)))}</b></p>`:'<p>Dear Ploy,</p>'}${body}<p class="sig">— ${esc(m.from||'Top')}</p></div><div class="row"><button class="btn ghost" data-a="letters">All letters</button><button class="btn" data-a="close">Close</button></div>`,'letter',true);
 if(first)setTimeout(()=>{if(!S.sleep){hearts(3);joy(1500)}},400)}
function tmListHTML(){const r=TM.filter(m=>S.tm.read.includes(m.id)).reverse();if(!r.length)return'';
 return`<p style="font:600 15px Fredoka,sans-serif;margin:16px 0 8px">From Top</p><div class="list">${r.map(m=>`<div class="env">${ico('envOpen')}<div><b>${esc(T(String(m.title||'Paper plane')))}</b><small>${esc(T(String(m.text)).slice(0,38))}…</small></div><button class="btn sm" data-a="tm" data-id="${esc(m.id)}">Open</button></div>`).join('')}</div>`}

/* --- away diary --- */
const DIARY={
 gen:["Chased my tail for ten minutes. Didn't catch it. Will try again.","Barked at a pigeon on the window. It did not leave. Rude.","Hid one of your socks under the sofa. You'll never find it.","Napped in the sunny spot by the window. Ten out of ten.","Practiced my Samoyed smile in the mirror. Still perfect.","Tried to open the fridge. Almost did it.","Sat by the door listening for your footsteps.","Rolled on the rug until I was 30% fluffier.","Watched the planes in the sky and waved at every single one.","Counted the lights on the string. Lost count at four.","Sniffed your pillow. Still smells like you.","Dreamed about a burger as big as a sofa.","Shed enough fur to make a whole new puppy. Sorry.","Guarded the house from a very suspicious leaf."],
 trip:["Top came by to feed me. He talks about you a lot.","Looked for your plane in the sky. Every plane might be you!","Top asked me if you landed safely yet. I said probably."],
 night:["Heard a noise at night. Bravely hid behind the sofa.","Slept on your side of the bed. It's warmer."],
 hungry:["My tummy started growling. I ate a crumb I found. Still hungry."],
 dirty:["Found a puddle. We are now friends. Bath soon?"],
 toy:["Played with Sunny the duck. Sunny won again."]};
function diaryPane(gap,wasTrip){const k=Math.min(5,1+Math.floor(gap/(3*36e5))),now=Date.now(),start=now-gap,pool=[...DIARY.gen];
 if(wasTrip)pool.push(...DIARY.trip,...DIARY.trip);if(gap>8*36e5)pool.push(...DIARY.night);if(S.st.hunger<30)pool.push(...DIARY.hungry);if(S.st.clean<35)pool.push(...DIARY.dirty);pool.push(...DIARY.toy);
 if(S.baby&&S.lv>=MAXL)pool.push(`${S.baby} and I had a fluff fight. I let ${S.baby} win.`,`Taught ${S.baby} how to sit. ${S.baby} sat on me.`);
 const lines=[];while(lines.length<k&&pool.length){const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];lines.push(x)}
 const ts=lines.map(()=>start+Math.random()*gap).sort((a,b)=>a-b),td=new Date().toDateString();
 const fmt=v=>{const d=new Date(v),tm=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});return d.toDateString()===td?tm:d.toLocaleDateString('en-US',{weekday:'short'})+' '+tm};
 const hrs=Math.round(gap/36e5);
 open(`<h2>While you were away</h2><p class="sub">${T('{n}')}'s diary · ${hrs<48?hrs+' hours':Math.round(hrs/24)+' days'} without you</p><div class="paper diary">${lines.map((x,i)=>`<p><b>${fmt(ts[i])}</b>${T(x)}</p>`).join('')}<p class="sig">— ${T('{n}')}</p></div><div class="row"><button class="btn" data-a="close">Aww, thank you</button></div>`,'diary',true);sfx('letter')}

/* --- check-in calendar --- */
function checkIn(){if(!S.name)return;const d=ymd();if(S.ck.days.includes(d))return;S.ck.days.push(d);const n=S.ck.days.length;save();
 if(n%7===0)setTimeout(()=>enqueue(()=>ckReward(n)),3200);else setTimeout(()=>toast(`Paw stamp ${n%7} of 7. ${7-n%7} more for a surprise!`),2000)}
function ckReward(n){S.fur+=30;const it=ITEMS.find(i=>i.ck===n);window._pxp=25;sfx('level');save();render();
 open(`${ico('star','big')}<h2 style="text-align:center">${n} days together!</h2><p style="text-align:center">Thank you for coming back, Ploy. Here's a little gift from ${T('{n}')}: <b>+30 fur</b> and <b>+25 XP</b>.</p>${it?`<p style="text-align:center">New in the closet: <b>${it.name}</b></p>`:''}<div class="row" style="justify-content:center"><button class="btn" data-a="close">Yay!</button></div>`,'ck',true)}
function ckHTML(){const n=S.ck.days.length,w=n%7===0&&n?7:n%7;
 return`<h2>Check-in</h2><p class="sub">A paw stamp for every day you visit. Every 7 stamps opens a surprise. Total: ${n} day${n===1?'':'s'}.</p><div class="dots" style="margin:0 0 18px">${Array.from({length:7},(_,k)=>`<i class="${k<w?'on':''}"></i>`).join('')}</div>`}

/* --- visitors book --- */
function visitorsHTML(){const met=FRIENDS.filter(d=>S.met[d.name]).length;
 return`<p style="font:600 15px Fredoka,sans-serif;margin:16px 0 8px">Visitors · ${met}/${FRIENDS.length}</p><div class="list">${FRIENDS.map(d=>{const m=S.met[d.name];return`<div class="env"><svg viewBox="-62 -78 124 82" width="44" height="30" aria-hidden="true"${m?'':' style="filter:brightness(0);opacity:.18"'}>${friendSVG(d.b)}</svg><div><b>${m?d.name+' the '+d.breed:'???'}</b><small>${m?'Visited ×'+m:d.rare?'A rare visitor. Keep checking in!':'Not met yet'}${d.rare&&m?' · rare':''}</small></div><span></span></div>`}).join('')}</div>`}

/* --- drag Sunny the duck --- */
let dk=null;
function duckInit(){const sv=$('#scene');
 sv.addEventListener('pointerdown',e=>{if(!e.target.closest('#sunny')||toyOut==='duck'||fetching)return;dk={x:e.clientX,y:e.clientY,m:false};e.preventDefault()});
 window.addEventListener('pointermove',e=>{if(!dk)return;if(!dk.m){if(Math.hypot(e.clientX-dk.x,e.clientY-dk.y)<8)return;dk.m=true;$('#sunny').classList.add('drag');sfx('squeak')}
  const p=scenePt(e),x=Math.max(18,Math.min(342,p.x)),y=Math.max(236,Math.min(278,p.y+10));S.duck=[Math.round(x),Math.round(y)];
  const g=$('#duckG');if(g)g.setAttribute('transform',`translate(${x} ${y-8}) scale(1.25) rotate(${f(Math.sin(Date.now()/90)*8)})`)});
 const end=()=>{if(!dk)return;const m=dk.m;dk=null;if(!m)return;noClick=true;setTimeout(()=>noClick=false,350);$('#sunny').classList.remove('drag');drawHome();sfx('squeak');save();
  if(!S.sleep&&!paneKind&&Math.random()<.4)setTimeout(()=>say(pick(['Hey! Where is Sunny going?','Sunny likes it there!','Ooh, a new spot for Sunny!'])),200)};
 window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end)}
duckInit();

setInterval(()=>{if(!S.sleep&&!paneKind&&Math.random()<.35)spawnFur(1)},20000);
setInterval(()=>{if(S.sleep||paneKind||fetching||scene!=='room'||!S.name||S.trip||CG||fr||targetX!==null||S.st.energy<30||Date.now()<busyUntil)return;if(Math.random()<.2)playToy(pick(['duck',...S.toys]))},30000);
